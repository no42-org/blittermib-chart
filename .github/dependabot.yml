version: 2
# `cooldown` holds back brand-new releases for a few days. A compromised
# package is typically yanked within hours of discovery, so waiting means
# Dependabot never proposes the malicious version in the first place.
# Security advisories bypass cooldown, so real fixes still arrive at once.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - github-actions
    # `init` and `analyze` run in the same job and CodeQL refuses to run
    # them at different versions. Dependabot sees each action path as its
    # own dependency, so an ungrouped bump splits into PRs that each fail
    # on the resulting mismatch and can never be merged. See #48.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
