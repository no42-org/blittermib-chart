name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# A cancelled release publishes half of itself — never cancel one in
# flight, just queue behind it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Same gates pull requests run. A tag is not a licence to skip them.
  gates:
    name: gates
    uses: ./.github/workflows/gates.yml
    permissions:
      contents: read

  # Same publish path main-branch previews run, with the release-only
  # artifacts switched on. Previews keep it warm between releases.
  chart:
    name: publish
    needs: gates
    uses: ./.github/workflows/publish.yml
    with:
      chart-version: ${{ github.ref_name }}
      release: true
    permissions:
      contents: write      # create the draft GitHub release
      packages: write      # push the chart to GHCR
      id-token: write      # keyless cosign: short-lived Fulcio cert
      attestations: write  # SLSA build provenance
