name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# A cancelled release publishes half of itself — never cancel one in
# flight, just queue behind it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Same gates pull requests run. A tag is not a licence to skip them.
  gates:
    name: gates
    uses: ./.github/workflows/gates.yml
    permissions:
      contents: read

  chart:
    name: Publish Helm chart
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write      # create the draft GitHub release
      packages: write      # push the chart to GHCR
      id-token: write      # keyless cosign: short-lived Fulcio cert
      attestations: write  # SLSA build provenance
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Log in to GHCR (Helm OCI registry)
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: helm registry login ghcr.io -u "$GHCR_USER" --password-stdin <<< "$GHCR_TOKEN"

      # cosign reads the DOCKER credential store, not helm's registry
      # config — without this the signature push is UNAUTHORIZED.
      - name: Log in to GHCR (docker config, for cosign)
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package chart
        # The CHART version comes from this repo's tag; appVersion
        # stays pinned in Chart.yaml (the app release this chart is
        # tested against).
        run: make package TAG="${GITHUB_REF_NAME}"

      - name: Push chart to GHCR
        id: chart_push
        # helm prints "Digest: sha256:…" on stderr — capture both
        # streams; tolerant extraction (the label is not a stable
        # API), first sha256 token wins, empty fails closed.
        env:
          CHART_REPO: ghcr.io/${{ github.repository_owner }}/charts
        run: |
          out=$(helm push dist/blittermib-*.tgz "oci://${CHART_REPO}" 2>&1)
          echo "$out"
          digest=$(echo "$out" | grep -oE 'sha256:[a-f0-9]{64}' | head -n1)
          if [ -z "$digest" ]; then
            echo "could not extract chart digest from helm push output" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign chart (keyless, by digest)
        # Signing runs AFTER the push — a Fulcio/Rekor outage fails a
        # re-runnable job, never the publication.
        env:
          CHART_REF: ghcr.io/${{ github.repository_owner }}/charts/blittermib@${{ steps.chart_push.outputs.digest }}
        run: cosign sign --yes "$CHART_REF"

      - name: Attest build provenance for the chart
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/charts/blittermib
          subject-digest: ${{ steps.chart_push.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          path: charts/blittermib
          format: spdx-json
          artifact-name: blittermib-chart.spdx.json
          output-file: dist/blittermib-chart.spdx.json
          upload-release-assets: false

      - name: Checksums
        run: |
          cd dist
          sha256sum blittermib-*.tgz blittermib-chart.spdx.json > checksums.txt
          cat checksums.txt

      - name: Sign checksums (keyless)
        run: |
          cosign sign-blob --yes \
            --output-signature dist/checksums.txt.sig \
            --output-certificate dist/checksums.txt.pem \
            dist/checksums.txt

      # Draft, not published: the tag push is what triggers this run,
      # so nothing can have created the release first. A human writes
      # the curated notes and publishes (see RELEASING.md).
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --draft --verify-tag \
            --title "blittermib chart ${TAG#v}" \
            --notes "Draft — replace with curated notes before publishing." \
            dist/blittermib-*.tgz \
            dist/blittermib-chart.spdx.json \
            dist/checksums.txt \
            dist/checksums.txt.sig \
            dist/checksums.txt.pem
