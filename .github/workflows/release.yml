name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write
  # Keyless cosign signing: short-lived Fulcio certificate bound to
  # THIS repository's workflow identity.
  id-token: write

jobs:
  chart:
    name: Publish Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Log in to GHCR (Helm OCI registry)
        run: |
          helm registry login ghcr.io \
            -u ${{ github.actor }} --password-stdin <<< "${{ secrets.GITHUB_TOKEN }}"

      # cosign reads the DOCKER credential store, not helm's registry
      # config — without this the signature push is UNAUTHORIZED.
      - name: Log in to GHCR (docker config, for cosign)
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package chart
        # The CHART version comes from this repo's tag; appVersion
        # stays pinned in Chart.yaml (the app release this chart is
        # tested against).
        run: make package TAG="${GITHUB_REF_NAME}"

      - name: Push chart to GHCR
        id: chart_push
        # helm prints "Digest: sha256:…" on stderr — capture both
        # streams; tolerant extraction (the label is not a stable
        # API), first sha256 token wins, empty fails closed.
        run: |
          out=$(helm push dist/blittermib-*.tgz \
            oci://ghcr.io/${{ github.repository_owner }}/charts 2>&1)
          echo "$out"
          digest=$(echo "$out" | grep -oE 'sha256:[a-f0-9]{64}' | head -n1)
          if [ -z "$digest" ]; then
            echo "could not extract chart digest from helm push output" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign chart (keyless, by digest)
        # Signing runs AFTER the push — a Fulcio/Rekor outage fails a
        # re-runnable job, never the publication.
        run: |
          cosign sign --yes \
            "ghcr.io/${{ github.repository_owner }}/charts/blittermib@${{ steps.chart_push.outputs.digest }}"
