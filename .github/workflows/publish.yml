# The publish path, defined ONCE. Called by ci.yml for main-branch
# previews and by release.yml for tags. Sharing it is the whole point:
# a preview that copied these steps would exercise a copy, and drift
# from it exactly where drift hurts most. Every merge to main now runs
# the same package/push/sign code a release runs.
name: Publish

on:
  workflow_call:
    inputs:
      chart-version:
        description: >
          Version to stamp into the chart. This is also the OCI tag —
          helm push derives the tag from the chart version and offers
          no way to override it. A leading "v" is stripped by
          `make package`.
        required: true
        type: string
      release:
        description: >
          Publish the full release artifact set: SBOM, SLSA provenance,
          signed checksums and a draft GitHub release. Previews publish
          the signed chart alone.
        required: false
        default: false
        type: boolean

# No permissions block here on purpose: a called workflow inherits what
# the caller granted at its `uses:` job, so each caller declares exactly
# what it needs and previews never hold contents/attestations write.

jobs:
  publish:
    name: ${{ inputs.release && 'release' || 'preview' }} ${{ inputs.chart-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR (Helm OCI registry)
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: helm registry login ghcr.io -u "$GHCR_USER" --password-stdin <<< "$GHCR_TOKEN"

      # cosign reads the DOCKER credential store, not helm's registry
      # config — without this the signature push is UNAUTHORIZED.
      - name: Log in to GHCR (docker config, for cosign)
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c  # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package chart
        # The CHART version is stamped by the caller; appVersion stays
        # pinned in Chart.yaml (the app release this chart is tested
        # against) in both preview and release builds.
        env:
          CHART_VERSION: ${{ inputs.chart-version }}
        run: make package TAG="$CHART_VERSION"

      - name: Push chart to GHCR
        id: chart_push
        # helm prints "Digest: sha256:…" on stderr — capture both
        # streams; tolerant extraction (the label is not a stable
        # API), first sha256 token wins, empty fails closed.
        env:
          CHART_REPO: ghcr.io/${{ github.repository_owner }}/charts
        run: |
          out=$(helm push dist/blittermib-*.tgz "oci://${CHART_REPO}" 2>&1)
          echo "$out"
          digest=$(echo "$out" | grep -oE 'sha256:[a-f0-9]{64}' | head -n1)
          if [ -z "$digest" ]; then
            echo "could not extract chart digest from helm push output" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign chart (keyless, by digest)
        # Signing runs AFTER the push — a Fulcio/Rekor outage fails a
        # re-runnable job, never the publication.
        env:
          CHART_REF: ghcr.io/${{ github.repository_owner }}/charts/blittermib@${{ steps.chart_push.outputs.digest }}
        run: cosign sign --yes "$CHART_REF"

      - name: Attest build provenance for the chart
        if: inputs.release
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/charts/blittermib
          subject-digest: ${{ steps.chart_push.outputs.digest }}
          push-to-registry: true

      # The SBOM subject is the APPLICATION IMAGE, not the chart. A
      # chart has no dependency graph — scanning it yields a single
      # synthetic package, i.e. checksums.txt in SPDX clothing. What
      # an operator needs to know is what they are about to run, so
      # take the image the chart actually renders by default.
      - name: Resolve the rendered application image
        if: inputs.release
        id: app_image
        run: |
          ref=$(helm template blittermib charts/blittermib \
            | awk '/^[[:space:]]*image:/ {gsub(/"/,"",$2); print $2; exit}')
          if [ -z "$ref" ]; then
            echo "could not resolve the rendered image reference" >&2
            exit 1
          fi
          echo "image reference: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM for the application image
        if: inputs.release
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: ${{ steps.app_image.outputs.ref }}
          format: spdx-json
          artifact-name: blittermib-image.spdx.json
          output-file: dist/blittermib-image.spdx.json
          upload-release-assets: false

      - name: Checksums
        if: inputs.release
        run: |
          cd dist
          sha256sum blittermib-*.tgz blittermib-image.spdx.json > checksums.txt
          cat checksums.txt

      # cosign v3 defaults to the new bundle format, which IGNORES
      # --output-signature/--output-certificate and requires --bundle;
      # passing neither aborts with an empty-path error. One bundle
      # carries both the signature and the certificate, and matches the
      # SHA256SUMS.sigstore.json the application repo publishes.
      - name: Sign checksums (keyless)
        if: inputs.release
        run: |
          cosign sign-blob --yes \
            --bundle dist/checksums.txt.sigstore.json \
            dist/checksums.txt

      # Draft, not published: the tag push is what triggers this run,
      # so nothing can have created the release first. A human writes
      # the curated notes and publishes (see RELEASING.md).
      #
      # The trigger glob v*.*.* also matches prereleases (v1.2.3-rc1),
      # so mark those --prerelease here. Without it, publishing an rc
      # draft would make it the repository's "Latest release".
      - name: Create draft GitHub release
        if: inputs.release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "${TAG#v}" in
            *-*) prerelease="--prerelease"; echo "prerelease tag: $TAG" ;;
          esac
          # shellcheck disable=SC2086  # deliberate: empty means "no flag"
          gh release create "$TAG" --draft --verify-tag $prerelease \
            --title "blittermib chart ${TAG#v}" \
            --notes "Draft — replace with curated notes before publishing." \
            dist/blittermib-*.tgz \
            dist/blittermib-image.spdx.json \
            dist/checksums.txt \
            dist/checksums.txt.sigstore.json

      - name: Preview summary
        if: ${{ !inputs.release }}
        env:
          CHART_VERSION: ${{ inputs.chart-version }}
          DIGEST: ${{ steps.chart_push.outputs.digest }}
        run: |
          {
            echo "### Preview chart published"
            echo
            echo '```bash'
            echo "helm install blittermib \\"
            echo "  oci://ghcr.io/${{ github.repository_owner }}/charts/blittermib \\"
            echo "  --version ${CHART_VERSION}"
            echo '```'
            echo
            echo "Digest \`${DIGEST}\`. Mutable — overwritten by the next merge to main."
          } >> "$GITHUB_STEP_SUMMARY"
