# OpenSSF Scorecard grades this repository's supply-chain posture from
# the outside — treat a dropped score as audit input, not a formality.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '17 4 * * 1'
  push:
    branches: [main]
  # Several checks score on state held outside this repository — ruleset
  # enforcement, the bestpractices.dev badge. Changing any of those leaves
  # the score stale with no commit to trigger a re-run, and the other
  # triggers do not fire for them: branch_protection_rule covers classic
  # protection, not rulesets. Without this, verifying such a change means
  # waiting for Monday or pushing a no-op commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write         # publish results to the OpenSSF API
      security-events: write  # upload SARIF to the security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # The default GITHUB_TOKEN cannot read admin-enforcement settings,
          # so Scorecard reports what it cannot see as disabled — it has been
          # scoring Branch-Protection on absent data. SCORECARD_TOKEN is an
          # organisation secret (admin:read) shared by the repos running this
          # workflow. Falls back to github.token when absent, so the run never
          # fails for want of the secret.
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}

      - uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3  # v4.37.6
        with:
          sarif_file: results.sarif
