name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded pushes to the same ref are wasted runner time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates
    uses: ./.github/workflows/gates.yml
    permissions:
      contents: read
