{{- if and .Values.mcp.enabled (not .Values.mcp.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "blittermib.fullname" . }}-mcp
  labels:
    {{- include "blittermib.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.mcp.existingSecretKey }}: {{ required "blittermib: mcp.enabled requires mcp.token (or point mcp.existingSecret at a Secret you manage)" .Values.mcp.token | quote }}
{{- end }}
