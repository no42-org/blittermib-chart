{{- include "blittermib.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "blittermib.fullname" . }}
  labels:
    {{- include "blittermib.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- if .Values.persistence.enabled }}
    # RWO PVC can't multi-attach during a rolling update → Recreate.
    type: Recreate
    {{- else }}
    type: RollingUpdate
    {{- end }}
  selector:
    matchLabels:
      {{- include "blittermib.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "blittermib.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "blittermib.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            # Corpus root defaults to <data>/mibs — curated tree,
            # import/ intake, and SQLite cache persist as one unit
            # on the data volume.
            - "-data"
            - "/var/lib/blittermib/data"
            - "-listen"
            - "0.0.0.0:8080"
          {{- if or .Values.uploads.enabled .Values.walkDecoder.enabled .Values.mcp.enabled .Values.compileTimeout }}
          env:
            {{- if .Values.compileTimeout }}
            - name: BLITTERMIB_COMPILE_TIMEOUT
              value: {{ .Values.compileTimeout | quote }}
            {{- end }}
            {{- if .Values.uploads.enabled }}
            - name: BLITTERMIB_UPLOAD_ENABLED
              value: "true"
            {{- end }}
            {{- if .Values.walkDecoder.enabled }}
            - name: BLITTERMIB_WALK_DECODER_ENABLED
              value: "true"
            {{- end }}
            {{- if .Values.mcp.enabled }}
            - name: BLITTERMIB_MCP_ENABLED
              value: "true"
            - name: BLITTERMIB_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mcp.existingSecret | default (printf "%s-mcp" (include "blittermib.fullname" .)) }}
                  key: {{ .Values.mcp.existingSecretKey }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            # Guards the listener-bind moment only. The app binds :8080
            # before the corpus load (it backgrounds the compile), so this
            # window is small — the long MIB ingest is covered by the
            # readiness probe, not startup. Tune via .Values.startupProbe.
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          readinessProbe:
            # /readyz is 503 until the corpus is loaded, then 200. The pod
            # stays out of the Service's endpoints (no traffic) during the
            # boot-time MIB ingest — Running but not Ready, never killed.
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            # /healthz is pure liveness — 200 as soon as the server serves,
            # independent of the corpus load. timeoutSeconds is raised off
            # the implicit 1s so a busy-but-alive server doesn't flap.
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/blittermib/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "blittermib.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
