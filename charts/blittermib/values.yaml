# Default values for blittermib.

# Single instance only. Horizontal scaling is unsupported: the SQLite
# cache is per-pod and (when enabled) web uploads are node-local, so
# replicas would diverge. Keep this at 1.
replicaCount: 1

image:
  # MUST be an image that bundles libsmi — the binary subprocesses
  # smidump/smilint at runtime. The official image does; a stripped or
  # scratch rebuild will fail at runtime. Don't swap this without libsmi.
  repository: ghcr.io/no42-org/blittermib
  pullPolicy: IfNotPresent
  # Defaults to the chart's appVersion when empty.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 8080

# Persist the data directory — ONE volume holding the curated corpus
# tree, the import/ intake, and the SQLite cache. STRONGLY recommended
# when importing MIBs: with the default emptyDir, imported MIBs and
# the cache vanish on pod replacement (the image's standard corpus is
# re-mirrored at boot either way). Enabling persistence switches the
# Deployment strategy to Recreate (an RWO volume can't attach to two
# pods during a rolling update).
persistence:
  enabled: false
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi

# Enable the in-browser MIB upload feature (sets
# BLITTERMIB_UPLOAD_ENABLED). Uploads run through the import
# pipeline; pair with persistence.enabled so imported MIBs survive
# pod replacement. To seed MIBs declaratively, use an initContainer
# that copies files into /var/lib/blittermib/data/mibs/import/ (the
# pipeline routes them on boot) — the former extraMibs ConfigMap
# mechanism is gone.
uploads:
  enabled: false

# Backstop timeout for compiling a single MIB, applied to BOTH the
# import pipeline and the boot-time corpus load (sets
# BLITTERMIB_COMPILE_TIMEOUT). A Go duration string, e.g. "20m". The
# app's built-in floor is 5m and this override is RAISE-ONLY: values
# below 5m — or empty/unparseable — are ignored by the app and the 5m
# default stands. Leave empty to keep the default; raise it only for
# legitimately huge single-file MIBs that need longer in smidump (e.g.
# METASWITCH-MIB, ~92k objects, ~10m) and would otherwise quarantine as
# a compile timeout.
compileTimeout: ""

# Expose the SNMP walk decoder at /walk (sets
# BLITTERMIB_WALK_DECODER_ENABLED): paste or upload an snmpwalk /
# snmpbulkwalk capture and decode it against the loaded MIBs. Walks
# are parsed in memory and never stored, so this has no persistence
# implications. When disabled the /walk routes 404.
walkDecoder:
  enabled: false

# Expose the read-only MCP tools over HTTP at /mcp (Streamable HTTP
# transport) for remote or shared AI-client access — the same five
# tools the stdio binary serves, but reachable over the network. Sets
# BLITTERMIB_MCP_ENABLED. Off by default. The endpoint is protected by
# a bearer token (BLITTERMIB_MCP_TOKEN) and FAILS CLOSED: enabled with
# an empty token, the route stays unregistered (404). The token
# authenticates but does not encrypt — terminate TLS at your ingress.
#
# The stdio MCP server (the blittermib-mcp binary) needs nothing here:
# it ships in the image and a client runs it via `kubectl exec` against
# the data volume — see the chart README.
mcp:
  enabled: false
  # Bearer token required on every /mcp request. Provide EITHER token
  # (the chart creates a Secret holding it) OR existingSecret (you own
  # the Secret). Required when mcp.enabled and existingSecret is unset.
  token: ""
  # Source the token from an existing Secret instead of `token`. The
  # key defaults to BLITTERMIB_MCP_TOKEN; override with existingSecretKey.
  existingSecret: ""
  existingSecretKey: BLITTERMIB_MCP_TOKEN

# Classic Ingress. Mutually exclusive with httpRoute (enabling both
# fails the render).
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: blittermib.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Gateway API HTTPRoute. References an EXISTING, platform-owned Gateway
# (the chart does not create a Gateway/GatewayClass). Mutually exclusive
# with ingress.
httpRoute:
  enabled: false
  parentRefs: []
    # - name: my-gateway
    #   namespace: gateway-system
    #   sectionName: https
  hostnames: []
    # - blittermib.example.com

# Pod-level security context.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# Container-level security context. The image is already non-root and
# writes only to the data/upload volumes and /tmp, so a read-only root
# filesystem is viable. Set readOnlyRootFilesystem to false if a future
# subprocess needs to write elsewhere.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 256Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# The server drains in-flight requests for up to 30s on shutdown; allow
# headroom above that.
terminationGracePeriodSeconds: 35

# Startup probe window guarding the listener bind only. The app binds
# :8080 immediately and backgrounds the boot-time MIB compile, so the
# bind is sub-second — the long corpus load is covered by the readiness
# probe (/readyz), not startup. Default window: 30 * 2s = 60s of grace.
startupProbe:
  periodSeconds: 2
  failureThreshold: 30

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
